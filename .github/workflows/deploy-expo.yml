# Деплой на https://tracker-mobile.expo.app/ с серверов GitHub (обход ECONNRESET с домашнего ПК).
#
# Один раз: Expo → Settings → Access tokens → Create → скопировать токен.
# GitHub → репозиторий → Settings → Secrets → Actions → New secret → EXPO_TOKEN
#
# Запуск: Actions → Deploy Expo Web → Run workflow

name: Deploy Expo Web

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        run: npm run export:web
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Deploy to production (tracker-mobile.expo.app)
        run: npx eas-cli deploy --prod --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
