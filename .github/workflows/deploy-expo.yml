name: Deploy to Expo Hosting

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to tracker-mobile.expo.app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run deploy:expo
